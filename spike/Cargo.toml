[package]
name = "notrieve-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# 本体クレートとは独立させる。
[workspace]

[dependencies]
anyhow = "1"
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "=0.1.9"
serde-saphyr = "1.3.0"
serde = { version = "1", features = ["derive"] }
