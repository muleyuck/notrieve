[package]
name = "notrieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local hybrid search over Markdown notes for AI agents via MCP"
repository = "https://github.com/muleyuck/notrieve"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1.8"
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
libc = "0.2"
pulldown-cmark = "0.13"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sqlite-vec = "=0.1.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.4"

[dev-dependencies]
rmcp = { version = "3.5", features = ["client"] }
tokio = { version = "1", features = ["macros", "io-util"] }
tempfile = "3"

# The profile release builds use (.github/workflows/build-release.yml)
[profile.dist]
inherits = "release"
lto = "thin"
