[package]
name = "notrieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local hybrid search over Markdown notes for AI agents via MCP"
repository = "https://github.com/muleyuck/notrieve"
publish = false

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
