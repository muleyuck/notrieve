[package]
name = "notrieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Local hybrid search over Markdown notes for AI agents via MCP"
repository = "https://github.com/muleyuck/notrieve"
publish = false

[dependencies]
blake3 = "1.8"
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
toml = "1.1"
ureq = "3.4"

[dev-dependencies]
tempfile = "3"
